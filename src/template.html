<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranquil Weather</title>
</head>
<body>
    <header>
        <h1>Tranquil Weather</h1>
        <form id="search-form">
            <input type="text" id="searchbar"/>
            <button type="submit" id="search-button">Search</button>
        </form>
    </header>
    <main>
        <aside id="location-sidebar">
            <ul id="location-list">
                <li class="location-item">location</li>
            </ul>
        </aside>
        <img id="sidebar-button" src="./images/list-ul-svgrepo-com.svg" alt="Click to see list of saved locations.">
        <article id="current-weather-wrapper">
            <h2 id="current-temp">Temperature</h1>
            <h3 id="current-location">Location</h3>
            <p id="current-high">High</p>
            <p id="current-low">Low</p>
            <p id="current-condition">Current condition</p>
            <div id="convert-wrapper">
                <p id="F" class="convert-select">F</p>
                <p>|</p>
                <p id="C">C</p>
            </div>
        </article>
        <section id="today">
            <div id="alert"></div>
            <p>Today</p>
            <div id="info-wrapper">
                <article class="card" id="feels-like">Feels like</article>
                <article class="card" id="wind">Wind</article>
                <article class="card" id="humidity">Humidity</article>
                <article class="card" id="uv-index">UV Index</article>
                <article class="card" id="air-quality">Air Quality (AQI)</article>
            </div>
            <div id="hourly-wrapper">
            </div>
        </section>
        <section>
            <p>Daily Forecast</p>
            <div id="forecast-wrapper">
                <!-- <article class="card forecast">day 1</article>
                <article class="card forecast">day 2</article>
                <article class="card forecast">day 3</article> -->
            </div>
        </section>
    </main>
    <footer>
        <p>Updated: </p>
        <p id="updated-time"></p>
    </footer>
    <!-- <div id="check">test</div> -->
</body>
</html>
