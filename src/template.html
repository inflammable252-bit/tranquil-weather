<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranquil Weather</title>
</head>
<body>
    <header>
        <h1>Tranquil Weather</h1>
    </header>
    <main>
        <aside id="location-sidebar">
            <ul id="location-list">
                <li class="location-item">location</li>
            </ul>
        </aside>
        <img id="sidebar-button" src="./images/list-ul-svgrepo-com.svg" alt="Click to see list of saved locations.">
        <article id="current-weather-wrapper">
            <h2 id="current-temp">Temperature</h1>
            <h3 id="current-location">Location</h3>
            <p id="current-condition">Current condition</p>
            <p id="current-high">High</p>
            <p id="current-low">Low</p>
        </article>
        <section>
            <p id="alert">! Weather alert, click to expand +</p>
            <p>Today</p>
            <div id="info-wrapper">
                <article class="card feels-like">Feels like</article>
                <article class="card wind">Wind</article>
                <article class="card humidity">Humidity</article>
                <article class="card uv-index">UV Index</article>
                <article class="card air-quality">Air Quality</article>
            </div>
            <div id="hourly-wrapper">
                <article class="card hour">hour 1</article>
                <article class="card hour">hour 2</article>
                <article class="card hour">hour 3</article>
            </div>
        </section>
        <section>
            <p>Daily Forecast</p>
            <div id="forecast-wrapper">
                <article class="card forecast">day 1</article>
                <article class="card forecast">day 2</article>
                <article class="card forecast">day 3</article>
            </div>
        </section>
    </main>
    <footer>
        <p>Updated: </p>
        <p id="updated-time"></p>
    </footer>
    <div id="check">test</div>
</body>
</html>
